<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sunny Bliss scroll-stopper concepts</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap">
<style>
:root{--teal:#005151;--yellow:#EDE939;--orange:#FF671F;--blue:#0097A9;--aqua:#00C7B1;--cream:#FFFDF2;--sky:#2FA8DC}
body{margin:0;background:#ddd;display:flex;flex-wrap:wrap;gap:20px;padding:20px;font-family:'Nunito',Arial,sans-serif;align-items:flex-start}
.ad{width:540px;position:relative;overflow:hidden;box-sizing:border-box;flex:none;display:flex;flex-direction:column}
.r45{height:675px}.r916{height:960px}
.disp{font-family:'Lilita One','Arial Black',sans-serif;font-weight:400;margin:0;line-height:.98}
p{margin:0}
.logo{position:absolute;top:18px;left:20px;height:74px;background:var(--cream);border-radius:14px;padding:6px 10px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.pill{align-self:flex-start;background:var(--orange);color:#fff;font:900 22px 'Nunito';padding:11px 20px;border-radius:14px}
.call{font:900 22px 'Nunito'}
.fine{font:800 13px 'Nunito';opacity:.9}
</style>
</head>
<body>
<div id="root" style="display:contents"></div>
<script>
const C = {
  ig_fl: {en:{hook:'Cold shower again?', sub:'Sediment is choking your water heater.', offer:'Flush $149', reg:'reg. $279', pill:'Book now', call:'Call 305-239-4987', lic:'Lic. CFC1433145'},
          es:{hook:'¿Otra vez agua fría?', sub:'El sedimento está ahogando tu calentador.', offer:'Limpieza $149', reg:'antes $279', pill:'Reserva ya', call:'Llama al 305-239-4987', lic:'Lic. CFC1433145'},
          bg:'var(--teal)', fg:'#fff', hook:'var(--yellow)', offer:'#fff'},
  ig_ev: {en:{hook:'Got an EV? Charge it at home.', sub:'Level 2 charger installed by licensed electricians.', offer:'$200 OFF', reg:'', pill:'Book now', call:'Call 305-239-4987', lic:'Lic. EC13011359'},
          es:{hook:'¿Auto eléctrico? Cárgalo en casa.', sub:'Cargador Nivel 2 instalado por electricistas con licencia.', offer:'$200 MENOS', reg:'', pill:'Reserva ya', call:'Llama al 305-239-4987', lic:'Lic. EC13011359'},
          bg:'var(--sky)', fg:'#002A27', hook:'#fff', offer:'var(--yellow)'},
  tg_fl: {en:{hook:'Hosting Thanksgiving?', sub:"Don't run out of hot water with a full house.", offer:'Water heater flush $149', reg:'reg. $279', pill:'Book before Nov 26', call:'Call 305-239-4987', lic:'Lic. CFC1433145'},
          es:{hook:'¿Visita en Thanksgiving?', sub:'Que no se acabe el agua caliente con la casa llena.', offer:'Limpieza del calentador $149', reg:'antes $279', pill:'Reserva antes del 26', call:'Llama al 305-239-4987', lic:'Lic. CFC1433145'},
          photo:'img/waterheater.jpg', pos:'center 68%', bg:'var(--yellow)', fg:'var(--teal)', hook:'var(--teal)', offer:'var(--teal)'},
  tg_tu: {en:{hook:'Full house for Thanksgiving?', sub:'Keep everyone cool. Our team checks your AC before the guests arrive.', offer:'AC tune-up $129', reg:'reg. $325', pill:'Book before Nov 26', call:'Call 305-239-4987', lic:'Lic. CAC1823405'},
          es:{hook:'¿Casa llena en Thanksgiving?', sub:'Que todos estén frescos. Revisamos tu aire antes de que lleguen.', offer:'Mantenimiento de A/C $129', reg:'antes $325', pill:'Reserva antes del 26', call:'Llama al 305-239-4987', lic:'Lic. CAC1823405'},
          photo:'img/team.jpg', pos:'center 40%', bg:'var(--teal)', fg:'#fff', hook:'var(--yellow)', offer:'var(--yellow)'}
};
function iguanaAd(k, lang, r){
  const o=C[k], t=o[lang], tall=r==='r916';
  const hs = t.hook.length>26 ? (tall?62:50) : (tall?74:58);
  return `<div class="ad ${r}" style="background:${o.bg};color:${o.fg}">
    <img class="logo" src="img/logo.png" alt="Sunny Bliss Plumbing &amp; Air">
    <div style="padding:${tall?150:110}px 34px 0;display:flex;flex-direction:column;gap:8px;position:relative;z-index:2">
      <p class="disp" style="font-size:${hs}px;color:${o.hook};text-shadow:0 3px 0 rgba(0,0,0,.18)">${t.hook}</p>
      <p style="font:800 ${tall?26:20}px/1.25 'Nunito';max-width:460px">${t.sub}</p>
    </div>
    <div style="flex:1;min-height:0;display:flex;justify-content:flex-end;align-items:center;padding:0 0 0 40px;margin-right:-20px"><img src="img/iguana_hi.png" alt="" style="max-height:100%;max-width:100%;object-fit:contain"></div>
    <div style="padding:0 34px 24px;display:flex;flex-direction:column;gap:8px;position:relative;z-index:2">
      <div style="display:flex;align-items:baseline;gap:12px;white-space:nowrap"><p class="disp" style="font-size:${t.offer.length>10?(tall?54:46):(tall?64:54)}px;color:${o.offer};-webkit-text-stroke:${o.offer==='#fff'?0:2}px var(--teal)">${t.offer}</p>${t.reg?`<p style="font:800 19px 'Nunito';text-decoration:line-through;text-decoration-color:var(--orange);text-decoration-thickness:3px">${t.reg}</p>`:''}</div>
      <span class="pill">${t.pill}</span>
      <p class="call">${t.call}</p>
      <p class="fine">sunnybliss.com · ${t.lic}</p>
    </div></div>`;
}
function photoAd(k, lang, r){
  const o=C[k], t=o[lang], tall=r==='r916';
  return `<div class="ad ${r}" style="background:${o.bg};color:${o.fg}">
    <div style="height:${tall?470:300}px;flex:none;background:url(${o.photo}) ${o.pos}/cover;position:relative">
      <img class="logo" src="img/logo.png" alt="Sunny Bliss Plumbing &amp; Air">
      <span style="position:absolute;right:18px;top:22px;background:var(--orange);color:#fff;font:900 15px 'Nunito';letter-spacing:1px;text-transform:uppercase;padding:9px 12px;border-radius:12px">🦃 Thanksgiving</span>
    </div>
    <div style="height:10px;flex:none;background:var(--orange)"></div>
    <div style="flex:1;padding:${tall?26:18}px 32px 24px;display:flex;flex-direction:column;gap:${tall?12:8}px">
      <p class="disp" style="font-size:${t.hook.length>24?(tall?52:44):(tall?58:50)}px;color:${o.hook}">${t.hook}</p>
      <p style="font:800 ${tall?22:19}px/1.25 'Nunito'">${t.sub}</p>
      <div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap"><p class="disp" style="font-size:${t.offer.length>22?(tall?36:30):(tall?42:36)}px;color:${o.offer}">${t.offer}</p><p style="font:800 18px 'Nunito';text-decoration:line-through;text-decoration-color:var(--orange);text-decoration-thickness:3px">${t.reg}</p></div>
      <span class="pill" style="font-size:20px">${t.pill}</span>
      <div style="margin-top:auto"><p class="call">${t.call}</p><p class="fine">sunnybliss.com · ${t.lic}</p></div>
    </div></div>`;
}
const root=document.getElementById('root');
for (const r of ['r45','r916']) for (const k of ['ig_fl','ig_ev','tg_fl','tg_tu']) for (const l of ['en','es']) {
  const w=document.createElement('div'); w.innerHTML=(k.startsWith('ig')?iguanaAd:photoAd)(k,l,r); const el=w.firstElementChild; el.id=`${k}_${l}_${r==='r45'?'4x5':'9x16'}`; root.appendChild(el);
}
</script>
</body>
</html>
