<!-- Orchid · autoplay silenciado del video de fundadores (copiado de GHL en vivo, 2026-11-19). Va AL FINAL del bloque 1. -->
<style>
.orx .video.orx-auto{cursor:pointer}
.orx .video.orx-auto::after,.orx .video.orx-auto .pay,.orx .video.orx-auto .play,.orx .video.orx-auto .vcap{display:none}
.orx .video .orx-unmute{position:absolute;top:12px;right:12px;z-index:7;display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border:0;border-radius:999px;background:rgba(0,0,0,.75);color:#fff;font-family:inherit;font-size:14px;font-weight:600;line-height:1;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.orx .video .orx-unmute svg{width:18px;height:18px;flex:none}
.orx .video .orx-unmute:focus-visible{outline:3px solid var(--yellow,#ffd54a);outline-offset:3px}
</style>
<script>
(function(){
  var v=document.querySelector('.orx .video[data-mp4]');
  if(!v||!('IntersectionObserver' in window)) return;
  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  if(navigator.connection&&navigator.connection.saveData) return;
  var SRC=v.getAttribute('data-mp4'), f=null, btn=null, io=null;
  var muted=true, userPaused=false, sysPlay=false, sysPause=false;
  function track(e){ try{ if(window.dataLayer) window.dataLayer.push({event:e}); }catch(_){} }
  function reset(){
    if(io) io.disconnect();
    if(f&&f.parentNode) f.parentNode.removeChild(f);
    if(btn&&btn.parentNode) btn.parentNode.removeChild(btn);
    f=btn=null; v.classList.remove('orx-auto');
  }
  function autoPlay(){
    sysPlay=true;
    var p=f.play();
    if(p&&p.catch) p.catch(function(err){ sysPlay=false; if(muted&&err&&err.name==='NotAllowedError') reset(); });
  }
  function unmute(e){
    if(e){ e.preventDefault(); e.stopPropagation(); }
    if(!f||!muted) return;
    muted=false; userPaused=false;
    if(btn&&btn.parentNode) btn.parentNode.removeChild(btn); btn=null;
    v.classList.remove('orx-auto'); v.classList.add('playing');
    f.muted=false; f.controls=true; f.style.cursor='';
    try{ f.currentTime=0; }catch(_){}
    var p=f.play(); if(p&&p.catch) p.catch(function(){});
    track('orchid_video_unmute');
  }
  function build(){
    f=document.createElement('video');
    f.muted=true; f.defaultMuted=true; f.setAttribute('muted','');
    f.playsInline=true; f.setAttribute('playsinline','');
    f.preload='auto'; f.controls=false; f.src=SRC;
    f.title="Meet Josué & Andrea, Orchid's founders";
    f.style.cssText='position:absolute;inset:0;width:100%;height:100%;border:0;z-index:5;background:#000;object-fit:contain;cursor:pointer';
    btn=document.createElement('button');
    btn.type='button'; btn.className='orx-unmute'; btn.setAttribute('aria-label','Turn on sound');
    btn.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="m23 9-6 6"/><path d="m17 9 6 6"/></svg>Tap for sound';
    v.classList.add('orx-auto'); v.appendChild(f); v.appendChild(btn);
    btn.addEventListener('click',unmute);
    f.addEventListener('click',function(e){ if(muted) unmute(e); });
    f.addEventListener('play',function(){ if(sysPlay){ sysPlay=false; return; } userPaused=false; });
    f.addEventListener('pause',function(){ if(sysPause){ sysPause=false; return; } userPaused=true; });
    f.addEventListener('ended',function(){ if(muted) reset(); });
    track('orchid_video_autoplay');
  }
  io=new IntersectionObserver(function(es){
    var en=es[es.length-1];
    var vis=en.isIntersecting&&en.intersectionRatio>=0.5;
    if(vis){
      if(!f){ if(v.classList.contains('playing')) return; build(); }
      if(f.paused&&!f.ended&&!userPaused) autoPlay();
    }else if(f&&!f.paused){ sysPause=true; f.pause(); }
  },{threshold:[0,0.5]});
  io.observe(v);
})();
</script>
