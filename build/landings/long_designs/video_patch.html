<!-- Orchid · parche de video (pegar AL FINAL del Custom Code del bloque 1 de la variante "B · Larga").
     Reemplaza el video de YouTube de relleno por el video de Andrea y Josué alojado en GHL.
     Cambia __VIDEO_URL__ por la URL del MP4 en la Media Library de GHL. -->
<script>
(function(){
  var URL_MP4='__VIDEO_URL__';
  var old=document.querySelector('.orx .video');
  if(!old) return;
  var v=old.cloneNode(true);            // the clone drops the old YouTube click handlers
  v.removeAttribute('data-yt'); v.setAttribute('data-mp4',URL_MP4);
  old.parentNode.replaceChild(v,old);
  var play=function(){
    if(v.classList.contains('playing')) return;
    var f=document.createElement('video');
    f.src=URL_MP4; f.controls=true; f.autoplay=true; f.playsInline=true; f.setAttribute('playsinline','');
    f.title="Meet Josué & Andrea, Orchid's founders";
    f.style.cssText='position:absolute;inset:0;width:100%;height:100%;border:0;z-index:5;background:#000;object-fit:contain';
    v.appendChild(f); v.classList.add('playing');
  };
  v.addEventListener('click',play);
  var btn=v.querySelector('.play');
  if(btn) btn.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); play(); } });
})();
</script>
